<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chat Viewer">
    
    <title>WhatsApp Zip Chat Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header style="display: flex; align-items: center; gap: 12px; padding: 10px 20px;">
        <div style="width: 38px; height: 38px; background: #ccc; border-radius: 50%; overflow: hidden;">
            <svg viewBox="0 0 24 24" fill="#fff" style="width: 100%; height: 100%; margin-top: 6px;"><path d="M12 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm9 11a1 1 0 0 1-2 0c0-2.76-2.69-5-7-5s-7 2.24-7 5a1 1 0 0 1-2 0c0-3.87 3.58-7 9-7s9 3.13 9 7z"/></svg>
        </div>
        <div style="line-height: 1.2;">
            <div style="font-size: 17px; font-weight: 500;">Chudail</div>
            <div style="font-size: 12px; opacity: 0.8;">tap here for contact info</div>
        </div>
    </header>
    
    <div class="controls">
        <label for="zipFile" class="file-label">Upload .zip</label>
        <input type="file" id="zipFile" accept=".zip">
        
        <!-- Search Toggle -->
        <button id="searchToggleBtn" title="Toggle Search">🔍</button>
        
        <!-- NEW: Calendar Date Picker -->
        <input type="date" id="datePicker" disabled title="Select a date to jump">

        <div style="margin-left: auto; font-size: 13px; color: #54656f; font-weight: 500; background: #fff; padding: 6px 10px; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
            👤 <b style="color: #00a884;">Himanshu</b>
        </div>

        <div class="search-box" id="searchBoxContainer">
            <input type="text" id="searchInput" placeholder="Search entire chat..." disabled>
            <button id="searchBtn" disabled>Search</button>
            <span id="searchResultText"></span>
            <button id="prevBtn" title="Previous Result" disabled>↑</button>
            <button id="nextBtn" title="Next Result" disabled>↓</button>
            <button id="clearBtn" disabled>Clear</button>
        </div>

        <div id="progress-bar-container" style="width: 100%; margin-top: 10px;">
            <div id="progress-bar"></div>
        </div>
        <span id="status-text" style="width: 100%; margin-top: 5px;">Select your exported WhatsApp .zip file...</span>
    </div>

    <div id="chat-container"></div>
    
    <!-- NEW: Pop-up Error Message -->
    <div id="toast-msg">No chats available on the entered date</div>

    <script src="jszip.min.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
